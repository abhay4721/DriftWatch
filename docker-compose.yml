name: driftwatch

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        KUBECTL_VERSION: ${KUBECTL_VERSION:-1.37.1}
    command: sh -c "alembic upgrade head && uvicorn driftwatch.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://driftwatch:change-this-local-password@postgres:5432/driftwatch}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DRIFTWATCH_ENV: ${DRIFTWATCH_ENV:-development}
      DRIFTWATCH_JWT_SECRET: ${DRIFTWATCH_JWT_SECRET:-driftwatch-local-development-secret-not-for-production}
      DRIFTWATCH_JWT_TTL_MINUTES: ${DRIFTWATCH_JWT_TTL_MINUTES:-30}
      DRIFTWATCH_GITHUB_REPOSITORY: ${DRIFTWATCH_GITHUB_REPOSITORY:-}
      DRIFTWATCH_GITHUB_TOKEN: ${DRIFTWATCH_GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [application, data]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        KUBECTL_VERSION: ${KUBECTL_VERSION:-1.37.1}
    command: python -m driftwatch.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://driftwatch:change-this-local-password@postgres:5432/driftwatch}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DRIFTWATCH_SOURCE_ROOT: /sources
      DRIFTWATCH_SCAN_TIMEOUT_SECONDS: ${DRIFTWATCH_SCAN_TIMEOUT_SECONDS:-300}
      DRIFTWATCH_WORKER_POLL_SECONDS: ${DRIFTWATCH_WORKER_POLL_SECONDS:-3}
      KUBECONFIG: ${DRIFTWATCH_KUBECONFIG:-/home/driftwatch/.kube/config}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./demo:/sources
    networks: [application, data]
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        KUBECTL_VERSION: ${KUBECTL_VERSION:-1.37.1}
    command: python -m driftwatch.scheduler
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://driftwatch:change-this-local-password@postgres:5432/driftwatch}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DRIFTWATCH_SCHEDULE_INTERVAL_SECONDS: ${DRIFTWATCH_SCHEDULE_INTERVAL_SECONDS:-3600}
      DRIFTWATCH_SCHEDULER_POLL_SECONDS: ${DRIFTWATCH_SCHEDULER_POLL_SECONDS:-30}
    depends_on:
      backend:
        condition: service_healthy
    networks: [application, data]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-driftwatch}
      POSTGRES_USER: ${POSTGRES_USER:-driftwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-local-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  application:
  data:
    internal: true
